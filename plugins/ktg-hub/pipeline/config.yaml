# KTG Content Pipeline Configuration
# Copy to config.local.yaml and customize

llm:
  # Provider: google (default), openrouter, ollama, lmstudio
  # Google is the engine. Local providers retained only as offline fallback.
  provider: google

  # Google AI Studio — DEFAULT engine (uses the GEMINI_API_KEY already in the shell)
  google:
    api_key: ${GEMINI_API_KEY}
    model: gemini-3.5-flash      # workhorse; bump to gemini-3-pro-preview for hero drafts
    temperature: 0.7
    max_tokens: 4000

  # OpenRouter — cloud fallback / model variety
  openrouter:
    api_key: ${OPENROUTER_API_KEY}
    model: qwen/qwen-2.5-72b-instruct
    temperature: 0.7
    max_tokens: 2000

  # --- Local fallback only (NOT default). Pipeline does not depend on these. ---
  ollama:
    base_url: http://localhost:11434
    model: llama3.2:latest
    temperature: 0.7
    max_tokens: 2000

  lmstudio:
    base_url: http://localhost:1234/v1
    model: local-model
    temperature: 0.7
    max_tokens: 2000
  
image_gen:
  # Provider: google (default), banana, comfyui, local_sd
  provider: google

  # Google Nano Banana — DEFAULT image engine
  google:
    api_key: ${GEMINI_API_KEY}
    model: gemini-3.1-flash-image-preview   # Nano Banana; nano-banana-pro-preview for hero quality
  
  # Local Stable Diffusion / ComfyUI
  local_sd:
    base_url: http://localhost:7860  # Automatic1111
    steps: 20
    cfg_scale: 7
  
  comfyui:
    base_url: http://localhost:8188
    workflow: workflows/ktg_hero.json

# Platform settings
platforms:
  medium:
    enabled: true
    max_length: 5000
  
  reddit:
    enabled: true
    max_length: 2000
    subreddit: r/artificial
  
  x:
    enabled: true
    thread_posts: 8
    max_length_per_post: 280
  
  linkedin:
    enabled: true
    max_length: 3000
    tone: professional
  
  meta:
    enabled: true
    max_length: 2000
    include_emoji: true

# Output settings
output:
  dir: pipeline/output
  # Publish-kit lives in the per-slug output dir (pipeline/output/<slug>/) — the
  # same dir the pipeline fills and the review gate / publish flow approve.
  publish_kit_dir: pipeline/output
  formats: [markdown, json, buffer_csv]

# SEO settings
seo:
  generate_meta: true
  generate_schema: true
  generate_keywords: true
  target_keyword_count: 5

# Ads settings
ads:
  generate_google: true
  generate_meta: true
  generate_linkedin: true
